# Alert fatigue is a safety problem. If a WARN fires more than twice a week without
# action, fix the cause or delete the alert — an operator who ignores alerts has none.
groups:
  - name: ux-critical
    rules:
      - alert: KillSwitchFired
        expr: ux_kill_switch_active > 0
        for: 0s
        labels: { severity: critical }
        annotations: { summary: "Kill switch active: {{ $labels.scope }}" }

      - alert: ReconciliationDrift
        expr: ux_reconciliation_drift_fraction > 0.001
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Position drift vs venue — follow RB-02" }

      - alert: VenueUnreachable
        expr: ux_venue_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Venue {{ $labels.venue }} unreachable — RB-01" }

      - alert: DailyLossLimit
        expr: ux_daily_pnl_pct < -0.03
        for: 0s
        labels: { severity: critical }

  - name: ux-warning
    rules:
      - alert: FeedStale
        expr: ux_feed_age_seconds > 10
        for: 30s
        labels: { severity: warning }

      - alert: SlippageDegraded
        expr: histogram_quantile(0.95, rate(ux_slippage_bps_bucket[1h])) > 2 * ux_slippage_model_bps
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Execution worse than model — check before blaming alpha decay" }

      - alert: MeanSlippageAboveModel
        # Histogram _sum is not exported (negative buckets), hence the signed-sum gauge.
        expr: sum(ux_slippage_bps_signed_sum) / sum(ux_slippage_bps_count) > 1.5 * ux_slippage_model_bps
        for: 6h
        labels: { severity: warning }

      - alert: RateLimitPressure
        expr: ux_ratelimit_utilisation > 0.70
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Rate-limit headroom shrinking; cancels must never be blocked" }

      - alert: OrderRejectRate
        expr: rate(ux_orders_rejected_total[15m]) / rate(ux_orders_submitted_total[15m]) > 0.05
        for: 15m
        labels: { severity: warning }
