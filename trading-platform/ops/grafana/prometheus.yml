global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: ux-trader
    static_configs:
      - targets:
          - strategy-engine:9100
          - execution:9100
          - risk:9100
          - portfolio:9100
          - md-ingest-binance:9100
